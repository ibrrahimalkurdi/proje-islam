<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <title>Barcodes for Ibrahim - XP-365B</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        /* ڕێکخستنا لاپەڕی بۆ ستیکەری */
        @page {
            size: 80mm 50mm; /* تو دشێی ڤی قەباری بگوهۆڕی ل دیف ستیکەرێ خۆ */
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eee;
        }
        .no-print {
            text-align: center;
            padding: 20px;
            background: #333;
            color: white;
        }
        .print-btn {
            padding: 10px 25px;
            font-size: 18px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        /* دیزاینێ هەر ستیکەرەکێ */
        .label {
            width: 75mm; /* کێمەک کێمتر ژ پانیا وەرەقێ */
            height: 45mm;
            background: white;
            margin: 5mm auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #ccc; /* تنێ بۆ دیاربوونێ د شاشێ دا */
            page-break-after: always; /* هەر بارکۆدەک ل سەر وەرەقەکێ */
        }
        @media print {
            body { background: white; }
            .label { border: none; margin: 0; }
            .no-print { display: none; }
        }
        .icon { font-size: 40px; margin-bottom: 5px; }
        .name { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: #000; }
        svg { width: 90%; height: auto; }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>Generatora بارکۆدان بۆ XP-365B</h1>
        <p>پشتی "Print" دکەی، تنظیماتێن وەرەقێ د نێڤبەرا 20mm تا 82mm دانە</p>
        <button class="print-btn" onclick="window.print()">چاپ بکە (Print Labels)</button>
    </div>

    <div id="labels-container"></div>

    <script>
        const products = [
            { name: "Pepsi", code: "1001", icon: "🥤" },
            { name: "Lays Chips", code: "1002", icon: "🍟" },
            { name: "Water", code: "1003", icon: "💧" },
            { name: "Nescafe", code: "1004", icon: "☕" },
            { name: "Kinder", code: "1005", icon: "🍫" },
            { name: "Indomie", code: "1006", icon: "🍜" },
            { name: "Biscuits", code: "1007", icon: "🍪" },
            { name: "Milk", code: "1008", icon: "🥛" },
            { name: "Zir Oil", code: "1009", icon: "🍾" },
            { name: "Duru Soap", code: "1010", icon: "🧼" },
            { name: "Rice", code: "1011", icon: "🍚" },
            { name: "Apple", code: "1012", icon: "🍎" },
            { name: "Tea", code: "1013", icon: "🍵" },
            { name: "Juice", code: "1014", icon: "🍹" }
        ];

        const container = document.getElementById('labels-container');

        products.forEach(p => {
            const div = document.createElement('div');
            div.className = 'label';
            div.innerHTML = `
                <div class="icon">${p.icon}</div>
                <div class="name">${p.name}</div>
                <svg id="barcode-${p.code}"></svg>
            `;
            container.appendChild(div);

            JsBarcode(`#barcode-${p.code}`, p.code, {
                format: "CODE128",
                width: 3,
                height: 60,
                displayValue: true,
                fontSize: 18
            });
        });
    </script>
</body>
</html>
